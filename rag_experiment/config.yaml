experiment:
  name: taco_skill_rag_v1
  seed: 20260419
  top_n_per_family: 30
  core_families:
    - amortized_analysis
    - bit_manipulation
    - complete_search
    - data_structures
    - dynamic_programming
    - greedy_algorithms
    - range_queries
    - sorting

paths:
  parent_datasets_dir: ../datasets          # existing folder with problems
  taco_hf_name: BAAI/TACO
  taco_hf_split: train

labeling:
  prompt_version_problem: problem_labeling@v1
  prompt_version_solution: solution_labeling@v1
  prompt_version_skill: skill_generation@v1
  max_retries: 3
  min_problem_confidence: 0.5
  min_solution_confidence: 0.5
  consistency:
    partial_overlap_min: 1         # at least 1 shared family to be "partial"

stage_c0:
  verified_source: local           # local | taco-verified
  taco_verified_hf_name: likaixin/TACO-verified
  taco_verified_split: train
  taco_split: train
  max_solutions_per_problem: 0     # 0 means verify every reference solution
  max_tests_per_solution: 0        # 0 means run all available official tests
  show_progress: true
  log_every_problems: 100
  blocked_imports:
    - os
    - subprocess
    - socket
    - requests
    - urllib
    - http
    - ftplib
    - pathlib
    - shutil
    - glob
    - multiprocessing
    - threading
    - ctypes
  blocked_calls:
    - eval
    - exec
    - compile
    - open
    - __import__
    - breakpoint

stage_d:
  allow_heuristic_fallback: false

rag:
  retrieval:
    mode: graph                     # flat | graph | subtype_rag | graph_subtype_rag
    dense_model: BAAI/bge-base-en-v1.5
    bm25_k1: 1.5
    bm25_b: 0.75
    top_k: 3                       # flat-retriever final top-k (kept for BC)
    fusion: rrf                    # rrf | dense_only | bm25_only | weighted
    rrf_k: 60
    # Graph-retriever specific knobs (ignored when mode=flat):
    seed_top_k: 20
    candidate_top_k: 50
    final_top_k: 1
    min_retrieval_score: 0.22      # flat/subtype: fallback if top1 score is below this (0-1 style)
    # routing_confidence = min(1, top_family_keyword_score/3) from query_analyzer; 0.35 would block all top_score==1.0 (rc=0.333)
    min_router_confidence: 0.32     # fallback if routing_confidence (or router_confidence alias) is below this
    very_low_score_ratio: 0.6      # if top1 score < min_retrieval_score * this ratio, force fallback even when router_confidence is missing
    # graph_subtype / graph: bundle scores are unbounded; use margin + relative-to-peak instead of min_retrieval_score
    min_score_margin_graph: 0.04    # fallback when top1 skill score too close to runner-up (uncertain ranking); 0 disables
    min_score_relative_graph: 0.14 # fallback when top1/population-max skill score ratio below this; 0 disables
    graph_alpha: 0.30
    graph_steps: 3
    conflict_penalty: 0.7
    max_bundle_size: 3
    max_prototype_per_skill: 1
    edge_weights:
      skill_implements_mechanism: 1.0
      skill_triggered_by_signal: 0.9
      prototype_problem_supports_skill: 0.8
      prototype_solution_supports_skill: 1.2
      skill_cooccurs_skill: 0.5
      bundle_contains_skill: 0.6
      skill_has_family: 0.5
      prototype_problem_has_signal: 0.4
      prototype_solution_uses_mechanism: 0.6
  index:
    index_dir: outputs/stage_e/index
    rebuild: false
  graph_index:
    dir: outputs/stage_e/graph_index
    v2_dir: outputs/stage_e/graph_index_v2
    rebuild: false
    max_prototype_per_skill_build: 8
  prompt:
    max_skill_tokens: 900          # real per-skill token budget in prompt

generation:
  samples_per_problem: 3
  first_sample_temperature: 0.15   # prioritize PASS@1 stability on sample r0
  first_sample_top_p: 0.90
  stop_sequences: ["```", "\n# END\n"]
  code_fence_language: python

evaluation:
  per_test_timeout_seconds: 5
  max_tests_per_problem: 20
  pass_strategy: all_visible       # all_visible | any
  sandbox:
    python_executable: python3
    memory_limit_mb: 512
    cpu_limit_seconds: 10
  output_dir: outputs/stage_f
  experiment_protocol:
    default_compare_modes: [no_rag, subtype_rag, graph_subtype_rag]
    require_clean_rerun_after_oom: true

logging:
  level: INFO
  file: outputs/run.log

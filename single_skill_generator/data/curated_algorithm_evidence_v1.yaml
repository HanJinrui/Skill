  dp_grid_path:
    statement: Count paths from the upper-left to lower-right grid cell while avoiding blocked cells and moving down or right.
    mechanism: Accumulate path counts from upper and left predecessor cells.
    reference_code: |
      def solve_case(blocked):
          rows, cols = len(blocked), len(blocked[0])
          dp = [[0] * cols for _ in range(rows)]
          if not blocked[0][0]:
              dp[0][0] = 1
          for r in range(rows):
              for c in range(cols):
                  if blocked[r][c] or (r == 0 and c == 0):
                      continue
                  if r:
                      dp[r][c] += dp[r - 1][c]
                  if c:
                      dp[r][c] += dp[r][c - 1]
          return dp[-1][-1]

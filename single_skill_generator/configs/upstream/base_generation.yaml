input:
  distillation_path: "data/distillation_rows.jsonl"

output:
  output_dir: "work/upstream/base"
  skill_bank_path: "work/upstream/base/single_skill_bank.jsonl"
  evidence_map_path: "work/upstream/base/single_skill_evidence_map.json"
  report_path: "work/upstream/base/single_skill_generation_report.json"
  generation_inputs_path: "work/upstream/base/single_skill_generation_inputs.jsonl"
  rejected_path: "work/upstream/base/rejected_or_held_subtypes.json"

filter:
  require_syntax_ok: true
  require_safe_exec_ok: true
  require_full_pass: true
  require_pass_rate: 1.0
  algorithm_scope: "single"
  require_true_composition_false: true
  require_primary_solution: true
  require_taco_family_alignment: true
  evidence_tier: "gold"
  min_subtype_confidence: 0.85

grouping:
  group_key: "primary_subtype"
  stable_min_rows: 10
  provisional_min_rows: 5
  hold_min_rows: 1

representative_selection:
  max_examples_per_skill: 8
  min_examples_per_skill: 5
  prefer_gold: true
  max_code_lines_soft: 160

llm:
  enabled: true
  provider: "deepseek"
  model: "deepseek-v4-pro"
  base_url: "https://api.deepseek.com/v1"
  temperature: 0.2
  max_tokens: 8192
  retry_times: 3
  cache_dir: "work/cache/base"
  timeout: 180.0
  max_workers: 3
  api_keys: []

validation:
  min_final_score: 0.85
  revise_score_threshold: 0.70
  max_repeated_problem_tokens: 50
  max_repeated_code_lines: 5
